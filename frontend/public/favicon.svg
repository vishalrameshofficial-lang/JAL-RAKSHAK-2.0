<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#20E3C2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Ring Shield -->
  <circle cx="50" cy="50" r="44" stroke="#082C3A" stroke-width="4" fill="#03131F" />
  <circle cx="50" cy="50" r="44" stroke="url(#waterGrad)" stroke-width="2" stroke-dasharray="8 4" opacity="0.8" />
  <!-- Water Droplet with Sensor Pulse -->
  <path d="M50 18 C50 18 30 45 30 60 C30 71.0457 38.9543 80 50 80 C61.0457 80 70 71.0457 70 60 C70 45 50 18 50 18 Z" fill="url(#waterGrad)" filter="url(#glow)" />
  <!-- Core IoT Wave Pulse -->
  <path d="M40 60 Q 45 55, 50 60 T 60 60" stroke="#03131F" stroke-width="3" stroke-linecap="round" fill="none" />
  <circle cx="50" cy="45" r="3" fill="#FFFFFF" />
</svg>
